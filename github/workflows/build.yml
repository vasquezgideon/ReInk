name: Build IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (xcode-27, macos-26, …)"
        required: false
        default: "xcode-27"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen || {
              curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
              unzip -q xcodegen.zip -d xcodegen-dl
              sudo cp xcodegen-dl/xcodegen/bin/xcodegen /usr/local/bin/
              sudo cp -R xcodegen-dl/xcodegen/share/xcodegen /usr/local/share/ 2>/dev/null || true
            }
          fi
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ReInk.xcodeproj \
            -target ReInk \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Summarize errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "error:" build.log | sort -u | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package IPA (ad-hoc signed with entitlements)
        run: |
          APP="build/Release-iphoneos/ReInk.app"
          test -d "$APP"
          # Embed the NFC entitlement so re-signers (SideStore, KSign, …) can carry it over.
          codesign --force --sign - --entitlements ReInk/ReInk.entitlements --timestamp=none "$APP"
          codesign -d --entitlements :- "$APP" || true
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry ReInk.ipa Payload)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ReInk-ipa
          path: dist/ReInk.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ReInk.ipa
